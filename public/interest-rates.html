<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인 기준금리 — 알림 관리자</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 28px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .admin-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
    }
    .admin-nav__link {
      color: #555;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .admin-nav__link:hover {
      color: #667eea;
      background: rgba(102, 126, 234, 0.12);
    }
    .admin-nav__link--active {
      color: #667eea;
      background: rgba(102, 126, 234, 0.15);
    }
    .content { padding: 28px; }
    .hint {
      background: #f8f9fa;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
    .hint code {
      font-size: 12px;
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555;
      font-size: 13px;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.35);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: #fff;
      color: #667eea;
      border: 2px solid #667eea;
      box-shadow: none;
    }
    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }
    .status.show { display: block; }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 메인 기준금리</h1>
      <p>Firestore <code style="background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 6px;">interestRates / current</code></p>
    </div>

    <nav class="admin-nav" aria-label="관리자 메뉴">
      <a href="/" class="admin-nav__link">알림 발송</a>
      <a href="/issue-keywords.html" class="admin-nav__link">실시간 이슈 검색어</a>
      <a href="/interest-rates.html" class="admin-nav__link admin-nav__link--active">메인 기준금리</a>
    </nav>

    <div class="content">
      <p class="hint">
        앱 메인 대시보드에 표시되는 미국(범위 문자열)·한국·일본 기준금리입니다.
        <code>node scripts/notification-server.js</code> 실행 후 이 페이지를 열고, 규칙에 <code>interestRates</code> 읽기 허용을 추가해야 합니다.
      </p>

      <div class="form-group">
        <label for="us">미국 (us) — 범위 문자열 등</label>
        <input type="text" id="us" placeholder="예: 3.50~3.75" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="kr">한국 (kr) — 숫자 (%)</label>
        <input type="number" id="kr" step="0.01" min="0" placeholder="예: 2.5" />
      </div>
      <div class="form-group">
        <label for="jp">일본 (jp) — 숫자 (%)</label>
        <input type="number" id="jp" step="0.01" min="0" placeholder="예: 0.75" />
      </div>

      <div class="actions-row">
        <button type="button" class="btn" id="btnSave">💾 Firestore에 저장</button>
        <button type="button" class="btn btn-secondary" id="btnReload">↻ 다시 불러오기</button>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    function showStatus(kind, text) {
      statusEl.className = 'status show ' + kind;
      statusEl.textContent = text;
    }
    function hideStatus() {
      statusEl.className = 'status';
      statusEl.textContent = '';
    }

    function msgApiNotFound() {
      return (
        'API(404): node scripts/notification-server.js 실행 후 http://localhost:3000/interest-rates.html 로 여세요.'
      );
    }

    function fillForm(data) {
      document.getElementById('us').value = data.us != null ? String(data.us) : '';
      document.getElementById('kr').value = data.kr != null && data.kr !== '' ? String(data.kr) : '';
      document.getElementById('jp').value = data.jp != null && data.jp !== '' ? String(data.jp) : '';
    }

    async function loadData() {
      hideStatus();
      try {
        const response = await fetch('/api/interest-rates');
        if (!response.ok) {
          if (response.status === 404) throw new Error(msgApiNotFound());
          throw new Error('HTTP ' + response.status);
        }
        const data = await response.json();
        if (data.success === false) throw new Error(data.error || '오류');
        fillForm(data);
      } catch (e) {
        showStatus('error', '불러오기 실패: ' + e.message);
      }
    }

    document.getElementById('btnReload').addEventListener('click', function () {
      loadData();
    });

    document.getElementById('btnSave').addEventListener('click', async function () {
      const btn = document.getElementById('btnSave');
      const us = (document.getElementById('us').value || '').trim();
      const krRaw = (document.getElementById('kr').value || '').trim();
      const jpRaw = (document.getElementById('jp').value || '').trim();
      if (!us) {
        showStatus('error', '미국(us) 값을 입력하세요.');
        return;
      }
      const kr = parseFloat(krRaw);
      const jp = parseFloat(jpRaw);
      if (!Number.isFinite(kr) || !Number.isFinite(jp)) {
        showStatus('error', '한국·일본은 숫자로 입력하세요.');
        return;
      }
      btn.disabled = true;
      hideStatus();
      try {
        const response = await fetch('/api/interest-rates', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ us: us, kr: kr, jp: jp }),
        });
        const data = await response.json().catch(function () {
          return {};
        });
        if (!response.ok) {
          if (response.status === 404) throw new Error(msgApiNotFound());
          throw new Error(data.error || '저장 실패');
        }
        fillForm(data);
        showStatus('success', '저장했습니다. Firestore interestRates/current 가 갱신되었습니다.');
      } catch (e) {
        showStatus('error', '저장 오류: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    });

    loadData();
  </script>
</body>
</html>
