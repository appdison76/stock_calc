<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expo 개발 서버 QR 코드</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .qr-code {
            margin: 30px 0;
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        .qr-code img {
            display: block;
            width: 300px;
            height: 300px;
        }
        .url {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            font-size: 14px;
        }
        .refresh {
            margin-top: 20px;
            padding: 12px 24px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .refresh:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Expo 개발 서버 QR 코드</h1>
        <div class="qr-code">
            <img src="qr-code.png" alt="QR Code" id="qrcode-img">
        </div>
        <div class="url" id="url">exp://localhost:8081</div>
        <button class="refresh" onclick="location.reload()">🔄 새로고침</button>
    </div>

    <script>
        // 이미지 로드 실패 시 대체 방법
        document.getElementById('qrcode-img').onerror = function() {
            const img = document.getElementById('qrcode-img');
            const container = img.parentElement;
            container.innerHTML = '<p style="color: red; padding: 20px;">QR 코드 이미지를 찾을 수 없습니다.<br>터미널에서 다음 명령어를 실행하세요:<br><code style="background: rgba(0,0,0,0.3); padding: 5px; border-radius: 5px;">npx qrcode "exp://localhost:8081" -o qr-code.png</code></p>';
        };
    </script>
</body>
</html>
